<!--
  Plantilla del mail del buzón de sugerencias.
  PROVISORIA: reemplazar por el HTML de la plantilla de EmailJS para mantener el mismo formato.
  Variables disponibles (misma sintaxis que EmailJS): {{user_email}}, {{type}}, {{message}}
  Todo lo que escribe el usuario se escapa antes de insertarse.
-->
<div style="font-family: Arial, sans-serif; font-size: 14px; color: #1e293b;">
  <h2 style="color: #4f46e5;">Nuevo mensaje en UTN Estratega</h2>
  <p><strong>De:</strong> {{user_email}}</p>
  <p><strong>Tipo:</strong> {{type}}</p>
  <p><strong>Mensaje:</strong></p>
  <p>{{message}}</p>
</div>
